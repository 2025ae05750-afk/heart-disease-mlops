apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard
  namespace: heart-mlops
data:
  dashboard.json: |
    {
      "title": "Heart Disease API Monitoring",
      "uid": "heart-api",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Requests per second",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [
            {"expr": "sum(rate(http_requests_total[1m]))", "legendFormat": "requests/sec"}
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Request latency p95",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [
            {"expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le))", "legendFormat": "p95"}
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Total requests",
          "gridPos": {"h": 5, "w": 8, "x": 0, "y": 8},
          "targets": [
            {"expr": "sum(http_requests_total)", "legendFormat": "total"}
          ]
        }
      ]
    }
